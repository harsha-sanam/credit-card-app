# Build Angular UI and push to docs/ folder for GitHub Pages
# In repo Settings → Pages → Source: Deploy from a branch → Branch: main → Folder: /docs
# Site: https://harsha-sanam.github.io/credit-card-app/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: client

      - name: Build for GitHub Pages
        run: npx ng build --configuration=production --base-href /credit-card-app/
        working-directory: client

      - name: Copy build to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r client/dist/client/browser/. docs/

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Deploy: update docs with latest UI build [skip ci]"
          git push
