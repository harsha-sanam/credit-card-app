<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-semibold text-slate-800 text-center mb-2">Credit Card Benefit Tracker</h1>
    <p class="text-slate-600 text-center mb-8">Sign in with your Google account to continue.</p>

    @if (error) {
      <div class="mb-6 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">

    <div class="flex justify-center mb-6" #googleButton></div>

  </div>
